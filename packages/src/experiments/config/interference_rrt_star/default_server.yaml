anytime_server:
  ros__parameters:
    # Anytime algorithm mode
    is_reactive_proactive: "proactive"  # Options: "reactive", "proactive"

    # Block processing configuration
    block_size: 256  # Number of RRT* iterations to compute per block

    # Reproducibility
    random_seed: 42  # Seed for reproducible RRT* results

    # Map configuration
    map_yaml_path: ""

    # Start/goal positions (world coordinates in meters)
    start_x: 5.0
    start_y: 12.0
    goal_x: 25.0
    goal_y: 2.0

    # RRT* algorithm parameters
    step_size: 0.5
    goal_threshold: 0.5
    goal_bias: 0.05
    gamma_rrt_star: 0.0    # 0 = auto-compute from map free area
    prune_interval: 1000
    convergence_log_interval: 100
